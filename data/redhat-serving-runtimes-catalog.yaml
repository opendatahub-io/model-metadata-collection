source: Red Hat Serving Runtimes
serving_runtimes:
    - name: vllm-cpu-runtime
      displayName: vLLM CPU (ppc64le/s390x) ServingRuntime for KServe
      provider: Red Hat, Inc.
      description: vLLM is a high-throughput and memory-efficient inference and serving engine for LLMs
      tags:
        - rhods
        - rhoai
        - kserve
        - servingruntime
      documentationUrl: https://github.com/opendatahub-io/vllm
      supportedModelFormats:
        - name: vLLM
          autoSelect: true
      capabilities: {}
      versions:
        - version: v0.21.0
          image: example.invalid/serving-runtimes/vllm-cpu:0.0.0-example
          supportLevel: redHatSupported
          defaultArgs:
            - --port=8080
            - --model=/mnt/models
            - --served-model-name={{.Name}}
          env:
            - name: HF_HOME
              defaultValue: /tmp/hf_home
    - name: vllm-cpu-x86-runtime
      displayName: vLLM CPU (x86) ServingRuntime for KServe
      provider: Red Hat, Inc.
      description: vLLM is a high-throughput and memory-efficient inference and serving engine for LLMs
      tags:
        - rhods
        - rhoai
        - kserve
        - servingruntime
      documentationUrl: https://github.com/opendatahub-io/vllm
      supportedModelFormats:
        - name: vLLM
          autoSelect: true
      capabilities: {}
      versions:
        - version: v0.21.0
          image: example.invalid/serving-runtimes/vllm-cpu-x86:0.0.0-example
          supportLevel: redHatSupported
          defaultArgs:
            - --port=8080
            - --model=/mnt/models
            - --served-model-name={{.Name}}
          env:
            - name: HF_HOME
              defaultValue: /tmp/hf_home
    - name: vllm-cuda-runtime
      displayName: vLLM NVIDIA GPU ServingRuntime for KServe
      provider: Red Hat, Inc.
      description: vLLM ServingRuntime with CUDA support (for NVIDIA GPUs)
      tags:
        - rhods
        - rhoai
        - kserve
        - servingruntime
      documentationUrl: https://github.com/opendatahub-io/vllm
      supportedModelFormats:
        - name: vLLM
          autoSelect: true
      capabilities:
        supportedAccelerators:
            - nvidia.com/gpu
      versions:
        - version: v0.21.0
          image: example.invalid/serving-runtimes/vllm-cuda:0.0.0-example
          supportLevel: redHatSupported
          defaultArgs:
            - --port=8080
            - --model=/mnt/models
            - --served-model-name={{.Name}}
          env:
            - name: HF_HOME
              defaultValue: /tmp/hf_home
    - name: vllm-gaudi-runtime
      displayName: vLLM Intel Gaudi Accelerator ServingRuntime for KServe
      provider: Red Hat, Inc.
      description: vLLM ServingRuntime to support Gaudi(for Habana AI processors)
      tags:
        - rhods
        - rhoai
        - kserve
        - servingruntime
      documentationUrl: https://github.com/opendatahub-io/vllm
      supportedModelFormats:
        - name: vLLM
      capabilities:
        supportedAccelerators:
            - habana.ai/gaudi
      versions:
        - version: v0.21.0
          image: example.invalid/serving-runtimes/vllm-gaudi:0.0.0-example
          supportLevel: redHatSupported
          defaultArgs:
            - --port=8080
            - --model=/mnt/models
            - --served-model-name={{.Name}}
          env:
            - name: HF_HOME
              defaultValue: /tmp/hf_home
    - name: vllm-rocm-runtime
      displayName: vLLM AMD GPU ServingRuntime for KServe
      provider: Red Hat, Inc.
      description: vLLM ServingRuntime to support ROCm (for AMD GPUs)
      tags:
        - rhods
        - rhoai
        - kserve
        - servingruntime
      documentationUrl: https://github.com/opendatahub-io/vllm
      supportedModelFormats:
        - name: vLLM
          autoSelect: true
      capabilities:
        supportedAccelerators:
            - amd.com/gpu
      versions:
        - version: v0.21.0
          image: example.invalid/serving-runtimes/vllm-rocm:0.0.0-example
          supportLevel: redHatSupported
          defaultArgs:
            - --port=8080
            - --model=/mnt/models
            - --served-model-name={{.Name}}
          env:
            - name: HF_HOME
              defaultValue: /tmp/hf_home
    - name: vllm-spyre-s390x-runtime
      displayName: vLLM Spyre s390x ServingRuntime for KServe
      provider: Red Hat, Inc.
      description: vLLM ServingRuntime to support IBM Spyre
      tags:
        - rhods
        - rhoai
        - kserve
        - servingruntime
      documentationUrl: https://github.com/vllm-project/vllm-spyre
      supportedModelFormats:
        - name: vLLM
          autoSelect: true
      capabilities:
        supportedAccelerators:
            - ibm.com/spyre_vf
      versions:
        - version: v0.21.0
          image: example.invalid/serving-runtimes/vllm-spyre-s390x:0.0.0-example
          supportLevel: redHatSupported
          defaultArgs:
            - --model=/mnt/models
            - --port=8000
            - --served-model-name={{.Name}}
          env:
            - name: HF_HOME
              defaultValue: /tmp/hf_home
            - name: FLEX_DEVICE
              defaultValue: VF
            - name: TOKENIZERS_PARALLELISM
              defaultValue: "false"
            - name: DTLOG_LEVEL
              defaultValue: error
            - name: TORCH_SENDNN_LOG
              defaultValue: CRITICAL
            - name: VLLM_SPYRE_USE_CB
              defaultValue: "1"
            - name: VLLM_SPYRE_REQUIRE_PRECOMPILED_DECODERS
              defaultValue: "1"
            - name: TORCH_SENDNN_CACHE_ENABLE
              defaultValue: "1"

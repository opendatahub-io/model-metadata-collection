capabilities:
  requiresGPU: true
  supportedAccelerators:
    - habana.ai/gaudi
description: vLLM ServingRuntime to support Gaudi(for Habana AI processors)
displayName: vLLM Intel Gaudi Accelerator ServingRuntime for KServe
documentationUrl: https://github.com/opendatahub-io/vllm
name: vllm-gaudi
provider: Red Hat, Inc.
supportedModelFormats:
  - name: vLLM
tags:
  - rhods
  - rhoai
  - kserve
  - servingruntime
versions:
  - image: registry.redhat.io/rhaii-fast/vllm-gaudi-rhel9:3.6.0-fast.1@sha256:e6e988c32b795cb9f74f752f3784c2c4f30ad256815b3c5d4caabff0e616696b
    minimumRHOAIVersion: "3.6"
    servingRuntimeTemplate:
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        annotations:
          description: vLLM ServingRuntime to support Gaudi(for Habana AI processors)
          opendatahub.io/apiProtocol: REST
          opendatahub.io/model-type: '["generative"]'
          opendatahub.io/modelServingSupport: '["single"]'
          openshift.io/display-name: vLLM Intel Gaudi Accelerator ServingRuntime for KServe
          openshift.io/provider-display-name: Red Hat, Inc.
          tags: rhods,rhoai,kserve,servingruntime
          template.openshift.io/documentation-url: https://github.com/opendatahub-io/vllm
          template.openshift.io/long-description: This template defines resources needed to deploy vLLM Intel Gaudi Accelerator ServingRuntime with KServe in Red Hat OpenShift AI
        labels:
          app: odh-dashboard
          app.kubernetes.io/part-of: odh-dashboard
          opendatahub.io/dashboard: "true"
          opendatahub.io/ootb: "true"
        name: 0-26-0-vllm-gaudi-runtime-template
        namespace: opendatahub
      objects:
        - apiVersion: serving.kserve.io/v1alpha1
          kind: ServingRuntime
          metadata:
            annotations:
              opendatahub.io/recommended-accelerators: '["habana.ai/gaudi"]'
              opendatahub.io/runtime-version: 0.26.0+rhaiv.7
              openshift.io/display-name: vLLM Intel Gaudi Accelerator ServingRuntime for KServe
            labels:
              opendatahub.io/dashboard: "true"
            name: 0-26-0-vllm-gaudi-runtime
          spec:
            annotations:
              opendatahub.io/kserve-runtime: vllm
              prometheus.io/path: /metrics
              prometheus.io/port: "8080"
            builtInAdapter:
              modelLoadingTimeoutMillis: 90000
            containers:
              - args:
                  - --port=8080
                  - --model=/mnt/models
                  - --served-model-name={{.Name}}
                command:
                  - python
                  - -m
                  - vllm.entrypoints.openai.api_server
                env:
                  - name: HF_HOME
                    value: /tmp/hf_home
                image: registry.redhat.io/rhaii-fast/vllm-gaudi-rhel9:3.6.0-fast.1@sha256:e6e988c32b795cb9f74f752f3784c2c4f30ad256815b3c5d4caabff0e616696b
                name: kserve-container
                ports:
                  - containerPort: 8080
                    protocol: TCP
            multiModel: false
            supportedModelFormats:
              - autoSelect: false
                name: vLLM
    supportLevel: techPreview
    version: 0.26.0+rhaiv.7

capabilities:
  requiresGPU: true
  supportedAccelerators:
    - ibm.com/spyre_pf
description: vLLM ServingRuntime to support IBM Spyre
displayName: vLLM Spyre on x86 ServingRuntime for KServe
documentationUrl: https://github.com/vllm-project/vllm-spyre
name: vllm-spyre-x86
provider: Red Hat, Inc.
supportedModelFormats:
  - autoSelect: true
    name: vLLM
tags:
  - rhods
  - rhoai
  - kserve
  - servingruntime
versions:
  - image: registry.redhat.io/rhaii-fast/vllm-spyre-rhel9:3.6.0-fast.1@sha256:904589b0e7c85da7bcc8cbd4c53330b7fe70bc1b60c8d695b9ea22e8d2d600b1
    minimumRHOAIVersion: "3.6"
    servingRuntimeTemplate:
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        annotations:
          description: vLLM ServingRuntime to support IBM Spyre
          opendatahub.io/apiProtocol: REST
          opendatahub.io/model-type: '["generative"]'
          opendatahub.io/modelServingSupport: '["single"]'
          openshift.io/display-name: vLLM Spyre on x86 ServingRuntime for KServe
          openshift.io/provider-display-name: Red Hat, Inc.
          tags: rhods,rhoai,kserve,servingruntime
          template.openshift.io/documentation-url: https://github.com/vllm-project/vllm-spyre
          template.openshift.io/long-description: This template defines resources needed to deploy vLLM Spyre AI Accelerator ServingRuntime with KServe in Red Hat OpenShift AI (x86 architectures only)
        labels:
          app: odh-dashboard
          app.kubernetes.io/part-of: odh-dashboard
          opendatahub.io/dashboard: "true"
          opendatahub.io/ootb: "true"
        name: 0-25-1-vllm-spyre-x86-runtime-template
        namespace: opendatahub
      objects:
        - apiVersion: serving.kserve.io/v1alpha1
          kind: ServingRuntime
          metadata:
            annotations:
              opendatahub.io/recommended-accelerators: '["ibm.com/spyre_pf"]'
              opendatahub.io/runtime-version: 0.25.1+rhaiv.1.spyre
              openshift.io/display-name: vLLM Spyre on x86 ServingRuntime for KServe
            labels:
              opendatahub.io/dashboard: "true"
            name: 0-25-1-vllm-spyre-x86-runtime
          spec:
            annotations:
              opendatahub.io/kserve-runtime: vllm
              prometheus.io/path: /metrics
              prometheus.io/port: "8080"
            containers:
              - args:
                  - --model=/mnt/models
                  - --port=8000
                  - --served-model-name={{.Name}}
                env:
                  - name: HF_HOME
                    value: /tmp/hf_home
                  - name: FLEX_COMPUTE
                    value: SENTIENT
                  - name: FLEX_DEVICE
                    value: PF
                  - name: TOKENIZERS_PARALLELISM
                    value: "false"
                  - name: DTLOG_LEVEL
                    value: error
                  - name: TORCH_SENDNN_LOG
                    value: CRITICAL
                  - name: VLLM_SPYRE_WARMUP_BATCH_SIZES
                    value: "4"
                  - name: VLLM_SPYRE_WARMUP_PROMPT_LENS
                    value: "1024"
                  - name: VLLM_SPYRE_WARMUP_NEW_TOKENS
                    value: "256"
                  - name: VLLM_SPYRE_REQUIRE_PRECOMPILED_DECODERS
                    value: "0"
                image: registry.redhat.io/rhaii-fast/vllm-spyre-rhel9:3.6.0-fast.1@sha256:904589b0e7c85da7bcc8cbd4c53330b7fe70bc1b60c8d695b9ea22e8d2d600b1
                name: kserve-container
                ports:
                  - containerPort: 8000
                    protocol: TCP
                volumeMounts:
                  - mountPath: /opt/ibm/spyre/models
                    name: spyre-cache
            multiModel: false
            schedulerName: spyre-scheduler
            supportedModelFormats:
              - autoSelect: true
                name: vLLM
            volumes:
              - emptyDir: {}
                name: spyre-cache
    supportLevel: techPreview
    version: 0.25.1+rhaiv.1.spyre

description: vLLM ServingRuntime to support ROCm (for AMD GPUs)
displayName: vLLM AMD GPU ServingRuntime for KServe
documentationUrl: https://github.com/opendatahub-io/vllm
name: vllm-rocm
provider: Red Hat, Inc.
supportedModelFormats:
  - autoSelect: true
    name: vLLM
tags:
  - rhods
  - rhoai
  - kserve
  - servingruntime
versions:
  - image: registry.redhat.io/rhaii-fast/vllm-rocm-rhel9:3.6.0-fast.1@sha256:f131cb5f2dfac4ee5dc71b9dfc5e9a3d295191c5d4699b3e95505516e7e9d9e6
    minimumRHOAIVersion: "3.6"
    servingRuntimeTemplate:
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        annotations:
          description: vLLM ServingRuntime to support ROCm (for AMD GPUs)
          opendatahub.io/apiProtocol: REST
          opendatahub.io/model-type: '["generative"]'
          opendatahub.io/modelServingSupport: '["single"]'
          openshift.io/display-name: vLLM AMD GPU ServingRuntime for KServe
          openshift.io/provider-display-name: Red Hat, Inc.
          tags: rhods,rhoai,kserve,servingruntime
          template.openshift.io/documentation-url: https://github.com/opendatahub-io/vllm
          template.openshift.io/long-description: This template defines resources needed to deploy vLLM AMD GPU ServingRuntime with KServe in Red Hat OpenShift AI
        labels:
          app: odh-dashboard
          app.kubernetes.io/part-of: odh-dashboard
          opendatahub.io/dashboard: "true"
          opendatahub.io/ootb: "true"
        name: 0-26-0-vllm-rocm-runtime-template
        namespace: opendatahub
      objects:
        - apiVersion: serving.kserve.io/v1alpha1
          kind: ServingRuntime
          metadata:
            annotations:
              opendatahub.io/recommended-accelerators: '["amd.com/gpu"]'
              opendatahub.io/runtime-version: 0.26.0+rhaiv.7
              openshift.io/display-name: vLLM AMD GPU ServingRuntime for KServe
            labels:
              opendatahub.io/dashboard: "true"
            name: 0-26-0-vllm-rocm-runtime
          spec:
            annotations:
              opendatahub.io/kserve-runtime: vllm
              prometheus.io/path: /metrics
              prometheus.io/port: "8080"
            containers:
              - args:
                  - --port=8080
                  - --model=/mnt/models
                  - --served-model-name={{.Name}}
                command:
                  - python
                  - -m
                  - vllm.entrypoints.openai.api_server
                env:
                  - name: HF_HOME
                    value: /tmp/hf_home
                image: registry.redhat.io/rhaii-fast/vllm-rocm-rhel9:3.6.0-fast.1@sha256:f131cb5f2dfac4ee5dc71b9dfc5e9a3d295191c5d4699b3e95505516e7e9d9e6
                name: kserve-container
                ports:
                  - containerPort: 8080
                    protocol: TCP
            multiModel: false
            supportedModelFormats:
              - autoSelect: true
                name: vLLM
    supportLevel: techPreview
    version: 0.26.0+rhaiv.7

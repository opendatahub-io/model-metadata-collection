    minimumRHOAIVersion: "3.6"
    servingRuntimeTemplate:
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        annotations:
          description: OpenVino Model Serving Definition
          opendatahub.io/apiProtocol: REST
          opendatahub.io/model-type: '["predictive"]'
          opendatahub.io/modelServingSupport: '["single"]'
          tags: kserve-ovms,servingruntime
        labels:
          app: odh-dashboard
          app.kubernetes.io/part-of: odh-dashboard
          opendatahub.io/dashboard: "true"
          opendatahub.io/ootb: "true"
        name: v2026-1-0-ovms
        namespace: opendatahub
      objects:
        - apiVersion: serving.kserve.io/v1alpha1
          kind: ServingRuntime
          metadata:
            annotations:
              opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
              opendatahub.io/runtime-version: v2026.1.0
              openshift.io/display-name: OpenVINO Model Server
            labels:
              opendatahub.io/dashboard: "true"
            name: v2026-1-0-ovms
          spec:
            annotations:
              opendatahub.io/kserve-runtime: ovms
              prometheus.io/path: /metrics
              prometheus.io/port: "8888"
            containers:
              - args:
                  - --model_name={{.Name}}
                  - --port=8001
                  - --rest_port=8888
                  - --model_path=/mnt/models

                ports:
                  - containerPort: 8888
                    protocol: TCP
            multiModel: false
            protocolVersions:
              - v2
              - grpc-v2
            supportedModelFormats:
              - autoSelect: true
                name: openvino_ir
                version: opset13
              - name: onnx
                version: "1"
              - autoSelect: true
                name: tensorflow
                version: "1"
              - autoSelect: true
                name: tensorflow
                version: "2"
              - autoSelect: true
                name: paddle
                version: "2"
              - autoSelect: true
                name: pytorch
                version: "2"

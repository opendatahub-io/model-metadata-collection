capabilities:
  requiresGPU: true
  supportedAccelerators:
    - nvidia.com/gpu
description: vLLM is a high-throughput and memory-efficient inference and serving engine for LLMs
displayName: vLLM Multi-Node ServingRuntime for KServe
documentationUrl: https://github.com/opendatahub-io/vllm
name: vllm-multinode
provider: Red Hat, Inc.
supportedModelFormats:
  - autoSelect: true
    name: vLLM
    priority: 2
tags:
  - rhods
  - rhoai
  - kserve
  - servingruntime
  - multi-node
versions:
  - image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1@sha256:5f1fb3f23bee2031abffd2216fac5e6458836facc06dc97029aac9a03120195f
    minimumRHOAIVersion: "3.6"
    servingRuntimeTemplate:
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        annotations:
          description: vLLM is a high-throughput and memory-efficient inference and serving engine for LLMs
          opendatahub.io/apiProtocol: REST
          opendatahub.io/model-type: '["generative"]'
          opendatahub.io/modelServingSupport: '["single"]'
          openshift.io/display-name: vLLM Multi-Node ServingRuntime for KServe
          openshift.io/provider-display-name: Red Hat, Inc.
          tags: rhods,rhoai,kserve,servingruntime,multi-node
          template.openshift.io/documentation-url: https://github.com/opendatahub-io/vllm
          template.openshift.io/long-description: This template defines resources needed to deploy vLLM Multi-Node ServingRuntime with KServe in Red Hat OpenShift AI
        labels:
          app: odh-dashboard
          app.kubernetes.io/part-of: odh-dashboard
          opendatahub.io/dashboard: "false"
          opendatahub.io/ootb: "true"
        name: 0-26-0-vllm-multinode-runtime-template
        namespace: opendatahub
      objects:
        - apiVersion: serving.kserve.io/v1alpha1
          kind: ServingRuntime
          metadata:
            annotations:
              opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
              opendatahub.io/runtime-version: 0.26.0+rhaiv.8
              openshift.io/display-name: vLLM Multi-Node ServingRuntime for KServe
            labels:
              opendatahub.io/dashboard: "false"
            name: 0-26-0-vllm-multinode-runtime
          spec:
            annotations:
              multinode/executor-backend: mp
              opendatahub.io/kserve-runtime: vllm
              prometheus.io/path: /metrics
              prometheus.io/port: "8080"
            containers:
              - args:
                  - /mnt/models
                  - --port=8080
                  - --served-model-name={{.Name}}
                  - --distributed-executor-backend=mp
                  - --tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)
                  - --pipeline-parallel-size=$(PIPELINE_PARALLEL_SIZE)
                  - --nnodes=$(PIPELINE_PARALLEL_SIZE)
                  - --node-rank=0
                  - --master-addr=$(POD_IP)
                  - --master-port=$(MASTER_PORT)
                command:
                  - vllm
                  - serve
                env:
                  - name: MASTER_PORT
                    value: "29500"
                  - name: POD_IP
                    valueFrom:
                      fieldRef:
                        fieldPath: status.podIP
                  - name: POD_NAMESPACE
                    valueFrom:
                      fieldRef:
                        fieldPath: metadata.namespace
                  - name: VLLM_NO_USAGE_STATS
                    value: "1"
                  - name: HOME
                    value: /tmp
                  - name: HF_HOME
                    value: /tmp/hf_home
                image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1@sha256:5f1fb3f23bee2031abffd2216fac5e6458836facc06dc97029aac9a03120195f
                livenessProbe:
                  exec:
                    command:
                      - bash
                      - -c
                      - |
                        health_code=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" -X POST http://localhost:8080/v1/completions \
                          -H "Content-Type: application/json" \
                          -d '{"model":"'"${MODEL_NAME}"'","prompt":"healthcheck","max_tokens":1}')
                        if [[ "${health_code}" != "200" ]]; then
                          echo "Unhealthy - inference check failed (HTTP ${health_code})."
                          exit 1
                        fi
                  failureThreshold: 3
                  periodSeconds: 30
                  successThreshold: 1
                  timeoutSeconds: 10
                name: kserve-container
                ports:
                  - containerPort: 8080
                    name: http
                    protocol: TCP
                readinessProbe:
                  failureThreshold: 2
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 5
                  successThreshold: 1
                  timeoutSeconds: 15
                resources:
                  limits:
                    cpu: "16"
                    memory: 48Gi
                  requests:
                    cpu: "8"
                    memory: 24Gi
                startupProbe:
                  failureThreshold: 120
                  httpGet:
                    path: /health
                    port: 8080
                  initialDelaySeconds: 20
                  periodSeconds: 30
                  successThreshold: 1
                  timeoutSeconds: 30
                volumeMounts:
                  - mountPath: /dev/shm
                    name: shm
            multiModel: false
            supportedModelFormats:
              - autoSelect: true
                name: vLLM
                priority: 2
            volumes:
              - emptyDir:
                  medium: Memory
                  sizeLimit: 12Gi
                name: shm
            workerSpec:
              containers:
                - args:
                    - /mnt/models
                    - --port=8080
                    - --served-model-name=$(ISVC_NAME)
                    - --distributed-executor-backend=mp
                    - --tensor-parallel-size=$(TENSOR_PARALLEL_SIZE)
                    - --pipeline-parallel-size=$(PIPELINE_PARALLEL_SIZE)
                    - --nnodes=$(PIPELINE_PARALLEL_SIZE)
                    - --master-addr=$(HEAD_SVC).$(POD_NAMESPACE).svc.cluster.local
                    - --master-port=$(MASTER_PORT)
                    - --headless
                  command:
                    - bash
                    - -c
                    - |
                      EXPECTED_WORKERS=$((PIPELINE_PARALLEL_SIZE - 1))
                      NODE_RANK=""
                      for i in $(seq 15); do
                        ALL_IPS=$(getent hosts ${WORKER_SVC} | awk '{print $1}' | sort -u)
                        NODE_RANK=$(echo "$ALL_IPS" | grep -nFx "${POD_IP}" | head -1 | cut -d: -f1)
                        [ "$(echo "$ALL_IPS" | grep -c .)" -ge "$EXPECTED_WORKERS" ] && [ -n "$NODE_RANK" ] && break
                        echo "Waiting for workers, attempt ${i}/15..."
                        sleep 2
                      done
                      [ -z "$NODE_RANK" ] && echo "Failed to resolve NODE_RANK" && exit 1
                      echo "NODE_RANK: $NODE_RANK"
                      exec vllm serve "$@" --node-rank=${NODE_RANK}
                    - --
                  env:
                    - name: HF_HOME
                      value: /tmp/hf_home
                    - name: MASTER_PORT
                      value: "29500"
                    - name: POD_NAME
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.name
                    - name: POD_NAMESPACE
                      valueFrom:
                        fieldRef:
                          fieldPath: metadata.namespace
                    - name: POD_IP
                      valueFrom:
                        fieldRef:
                          fieldPath: status.podIP
                  image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1@sha256:5f1fb3f23bee2031abffd2216fac5e6458836facc06dc97029aac9a03120195f
                  livenessProbe:
                    exec:
                      command:
                        - bash
                        - -c
                        - |
                          health_code=$(curl -s --max-time 5 -o /dev/null -w "%{http_code}" -X POST http://${HEAD_SVC}.${POD_NAMESPACE}.svc.cluster.local:8080/v1/completions \
                            -H "Content-Type: application/json" \
                            -d '{"model":"'"${ISVC_NAME}"'","prompt":"healthcheck","max_tokens":1}')
                          if [[ "${health_code}" != "200" ]]; then
                            echo "Unhealthy - inference check failed (HTTP ${health_code})."
                            exit 1
                          fi
                    failureThreshold: 3
                    periodSeconds: 30
                    successThreshold: 1
                    timeoutSeconds: 10
                  name: worker-container
                  readinessProbe:
                    exec:
                      command:
                        - bash
                        - -c
                        - |
                          model_health_check=$(curl -s ${HEAD_SVC}.${POD_NAMESPACE}.svc.cluster.local:8080/v1/models | grep -q "\"id\":\"${ISVC_NAME}\"" && echo true || echo false)
                          if [[ "${model_health_check}" == "false" ]]; then
                            echo "Not Ready - vLLM Runtime Health Check failed."
                            exit 1
                          fi
                    failureThreshold: 2
                    periodSeconds: 5
                    successThreshold: 1
                    timeoutSeconds: 15
                  resources:
                    limits:
                      cpu: "16"
                      memory: 48Gi
                    requests:
                      cpu: "8"
                      memory: 24Gi
                  startupProbe:
                    exec:
                      command:
                        - bash
                        - -c
                        - |
                          model_health_check=$(curl -s ${HEAD_SVC}.${POD_NAMESPACE}.svc.cluster.local:8080/v1/models | grep -q "\"id\":\"${ISVC_NAME}\"" && echo true || echo false)
                          if [[ "${model_health_check}" == "false" ]]; then
                            echo "Unhealthy - vLLM Runtime Health Check failed."
                            exit 1
                          fi
                    failureThreshold: 120
                    initialDelaySeconds: 20
                    periodSeconds: 30
                    successThreshold: 1
                    timeoutSeconds: 30
                  volumeMounts:
                    - mountPath: /dev/shm
                      name: shm
              pipelineParallelSize: 2
              tensorParallelSize: 1
              volumes:
                - emptyDir:
                    medium: Memory
                    sizeLimit: 12Gi
                  name: shm
    supportLevel: techPreview
    version: 0.26.0+rhaiv.8

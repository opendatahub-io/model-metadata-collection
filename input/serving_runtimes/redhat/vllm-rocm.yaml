# Example based on the vLLM ROCm ServingRuntime in odh-model-controller:
# https://github.com/opendatahub-io/odh-model-controller/blob/c05192b084800096a960a65137e9d4c2f14792c1/config/runtimes/vllm/vllm-rocm-template.yaml
# LLM config adapts the same repo's generic single-node GPU sample for amd.com/gpu:
# https://github.com/opendatahub-io/odh-model-controller/blob/c05192b084800096a960a65137e9d4c2f14792c1/server/samples/workload-single-node.yaml
# Replace the dummy image and review the support level before publishing.
name: vllm-rocm
displayName: vLLM AMD GPU ServingRuntime for KServe
provider: Red Hat, Inc.
description: vLLM ServingRuntime to support ROCm (for AMD GPUs)
documentationUrl: https://github.com/opendatahub-io/vllm
tags: [rhods, rhoai, kserve, servingruntime]
supportedModelFormats:
  - name: vLLM
    autoSelect: true
capabilities:
  requiresGPU: true
  supportedAccelerators: [amd.com/gpu]
  multiModel: false
versions:
  - version: v0.21.0 # From the ServingRuntime's opendatahub.io/runtime-version annotation.
    image: registry.example.com/example/vllm-rocm:v0.21.0 # Dummy reference; replace with a real pinned image.
    supportLevel: community # Example classification; confirm the intended support policy.
    servingRuntimeTemplate:
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        name: vllm-rocm-runtime-template
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/ootb: "true"
        annotations:
          description: vLLM ServingRuntime to support ROCm (for AMD GPUs)
          openshift.io/display-name: vLLM AMD GPU ServingRuntime for KServe
          openshift.io/provider-display-name: Red Hat, Inc.
          tags: rhods,rhoai,kserve,servingruntime
          template.openshift.io/documentation-url: https://github.com/opendatahub-io/vllm
          template.openshift.io/long-description: This template defines resources needed to deploy vLLM AMD GPU ServingRuntime with KServe in Red Hat OpenShift AI
          opendatahub.io/modelServingSupport: '["single"]'
          opendatahub.io/apiProtocol: REST
          opendatahub.io/model-type: '["generative"]'
      objects:
        - apiVersion: serving.kserve.io/v1alpha1
          kind: ServingRuntime
          metadata:
            name: vllm-rocm-runtime
            annotations:
              openshift.io/display-name: vLLM AMD GPU ServingRuntime for KServe
              opendatahub.io/recommended-accelerators: '["amd.com/gpu"]'
              opendatahub.io/runtime-version: v0.21.0
            labels:
              opendatahub.io/dashboard: "true"
          spec:
            annotations:
              opendatahub.io/kserve-runtime: vllm
              prometheus.io/port: "8080"
              prometheus.io/path: /metrics
            multiModel: false
            supportedModelFormats:
              - autoSelect: true
                name: vLLM
            containers:
              - name: kserve-container
                image: registry.example.com/example/vllm-rocm:v0.21.0 # Dummy reference; use the approved version.image.
                command:
                  - python
                  - -m
                  - vllm.entrypoints.openai.api_server
                args:
                  - --port=8080
                  - --model=/mnt/models
                  - --served-model-name={{.Name}}
                env:
                  - name: HF_HOME
                    value: /tmp/hf_home
                ports:
                  - containerPort: 8080
                    protocol: TCP
    llmInferenceServiceConfig: # Generic single-node GPU topology adapted for AMD; size resources for the model.
      apiVersion: serving.kserve.io/v1alpha2
      kind: LLMInferenceServiceConfig
      metadata:
        name: single-node-amd-gpu
        labels:
          opendatahub.io/config-type: workload-single-node
        annotations:
          description: >-
            Standard single-node GPU deployment with intelligent scheduling.
            Suitable for models that fit in a single GPU.
      spec:
        template:
          containers:
            - name: main
              resources:
                limits:
                  cpu: "4"
                  memory: 32Gi
                  amd.com/gpu: "1"
                requests:
                  cpu: "2"
                  memory: 16Gi
                  amd.com/gpu: "1"

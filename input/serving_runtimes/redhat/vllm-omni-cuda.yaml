# Example based on the vLLM-Omni CUDA ServingRuntime in odh-model-controller:
# https://github.com/opendatahub-io/odh-model-controller/blob/c05192b084800096a960a65137e9d4c2f14792c1/config/runtimes/vllm-omni/vllm-omni-cuda-template.yaml
# LLM config from the same repo's generic single-node GPU sample:
# https://github.com/opendatahub-io/odh-model-controller/blob/c05192b084800096a960a65137e9d4c2f14792c1/server/samples/workload-single-node.yaml
# Replace the dummy image and review the support level before publishing.
name: vllm-omni-cuda
displayName: vLLM-Omni NVIDIA GPU ServingRuntime for KServe - Tech Preview
provider: Red Hat, Inc.
description: vLLM-Omni ServingRuntime with CUDA support for multimodal inference (audio, vision, diffusion) on NVIDIA GPUs
documentationUrl: https://github.com/vllm-project/vllm-omni
tags: [rhods, rhoai, kserve, servingruntime]
supportedModelFormats:
  - name: vLLM
    autoSelect: false
capabilities:
  requiresGPU: true
  supportedAccelerators: [nvidia.com/gpu]
  multiModel: false
versions:
  - version: v0.26.0 # From the ServingRuntime's opendatahub.io/runtime-version annotation.
    image: registry.example.com/example/vllm-omni-cuda:v0.26.0 # Dummy reference; replace with a real pinned image.
    supportLevel: community # Example classification: source marks this runtime unsupported despite its Tech Preview display name.
    servingRuntimeTemplate:
      apiVersion: template.openshift.io/v1
      kind: Template
      metadata:
        name: vllm-omni-cuda-runtime-template
        labels:
          opendatahub.io/dashboard: "true"
          opendatahub.io/ootb: "true"
        annotations:
          description: vLLM-Omni ServingRuntime with CUDA support for multimodal inference (audio, vision, diffusion) on NVIDIA GPUs
          openshift.io/display-name: vLLM-Omni NVIDIA GPU ServingRuntime for KServe - Tech Preview
          openshift.io/provider-display-name: Red Hat, Inc.
          tags: rhods,rhoai,kserve,servingruntime
          template.openshift.io/documentation-url: https://github.com/vllm-project/vllm-omni
          template.openshift.io/long-description: This template defines resources needed to deploy vLLM-Omni NVIDIA GPU ServingRuntime with KServe in Red Hat OpenShift AI for multimodal inference including omni, diffusion, and TTS models (Tech Preview)
          opendatahub.io/modelServingSupport: '["single"]'
          opendatahub.io/apiProtocol: REST
          opendatahub.io/model-type: '["generative"]'
          opendatahub.io/support-status: unsupported
      objects:
        - apiVersion: serving.kserve.io/v1alpha1
          kind: ServingRuntime
          metadata:
            name: vllm-omni-cuda-runtime
            annotations:
              openshift.io/display-name: vLLM-Omni NVIDIA GPU ServingRuntime for KServe - Tech Preview
              opendatahub.io/recommended-accelerators: '["nvidia.com/gpu"]'
              opendatahub.io/runtime-version: v0.26.0
              opendatahub.io/support-status: unsupported
            labels:
              opendatahub.io/dashboard: "true"
          spec:
            annotations:
              opendatahub.io/kserve-runtime: vllm-omni
              prometheus.io/port: "8080"
              prometheus.io/path: /metrics
              monitoring.opendatahub.io/scrape: "true"
            multiModel: false
            supportedModelFormats:
              - autoSelect: false
                name: vLLM
            containers:
              - name: kserve-container
                image: registry.example.com/example/vllm-omni-cuda:v0.26.0 # Dummy reference; use the approved version.image.
                command:
                  - vllm
                  - serve
                args:
                  - --port=8080
                  - --model=/mnt/models
                  - --omni
                  - --log-stats
                  - --served-model-name={{.Name}}
                env:
                  - name: HF_HOME
                    value: /tmp/hf_home
                ports:
                  - containerPort: 8080
                    protocol: TCP
                startupProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  failureThreshold: 40
                  periodSeconds: 30
                readinessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 10
                  failureThreshold: 3
                livenessProbe:
                  httpGet:
                    path: /health
                    port: 8080
                  periodSeconds: 15
                  failureThreshold: 3
                securityContext:
                  allowPrivilegeEscalation: false
                  privileged: false
                  runAsNonRoot: true
                  capabilities:
                    drop:
                      - ALL
    llmInferenceServiceConfig: # Generic single-node GPU topology; size resources for the chosen model.
      apiVersion: serving.kserve.io/v1alpha2
      kind: LLMInferenceServiceConfig
      metadata:
        name: single-node-gpu
        labels:
          opendatahub.io/config-type: workload-single-node
        annotations:
          description: >-
            Standard single-node GPU deployment with intelligent scheduling.
            Suitable for models that fit in a single GPU.
      spec:
        template:
          containers:
            - name: main
              resources:
                limits:
                  cpu: "4"
                  memory: 32Gi
                  nvidia.com/gpu: "1"
                requests:
                  cpu: "2"
                  memory: 16Gi
                  nvidia.com/gpu: "1"

# Paths are relative to the repository root.
# Runtime image parameters may use floating tags (including latest). Generation
# resolves each tag once to a tag@sha256:digest reference before rendering or SBOM
# discovery; existing digest pins are retained. The configuration stays unchanged.
# Parameter images, including digest pins, are checked in the registry. Explicitly
# missing images exclude only runtime versions that use them. Authentication
# failures stop generation by default; --skip-unavailable-images also skips
# unauthorized/not-found parameter images and unavailable controller/source-image
# lookups (Make: SERVING_RUNTIME_SKIP_UNAVAILABLE_IMAGES=true).
# Controller/source availability is checked before runtime parameters.
# Source extraction is cached by immutable digest only for the current run;
# each entry renders its own copy. No cache persists between invocations.
# HTTP 408/429/500/502/503/504 and transient network errors receive up to three
# retries with 1/2/4-second backoff. Exhausted retries remain fatal.
# Missing unused parameters exclude no entries.
# Source params.env defaults are replaced
# in a temporary copy before Kustomize renders the templates.
# Validation requires every generated deployment image to start with
# registry.redhat.io/rhoai/, registry.redhat.io/rhaii/,
# registry.redhat.io/rhaii-early-access/, or registry.redhat.io/rhaii-fast/.
# EA repositories were selected from rhods-operator.3.6.0-ea.1:
# registry.redhat.io/rhoai/odh-operator-bundle@sha256:0f3f08fe3d76327b6df7259f5d6e5b4e06d0a8a7dc5c8bf0ba1e6d8330ca47e0
# Published aliases use rhoai/...:v3.6-ea.1 and rhaii-fast/...:3.6.0-fast.1.
# Aliases may advance to rebuilt images within that EA/fast release.
# Source IDs identify the RHOAI release.
# Use distinct IDs for additional releases or builds.
# Upstream vLLM versions are discovered from SPDX SBOM attestations.
# Support is inferred from target_image and the rendered images.
# Use RHOAI release tags in target_image (a tag plus digest is also allowed).
# Each generated version defaults minimumRHOAIVersion to the tag's major.minor:
# v3.6.0-ea.1-1788535633 or rhoai-3.6 -> "3.6".
# Digest-only targets cannot provide this default.
# A per-template minimum_rhoai_version overrides the default for that source.
# This field is a catalog extension; the current model-registry API/loader ignore it.
# Only base parameter keys are configured; fast-1/fast-2 slots are left unchanged.
source: Red Hat Serving Runtimes
sources:
  - id: kserve-llmisvc-3-6-0-ea-1
    target_image: registry.redhat.io/rhoai/odh-kserve-llmisvc-controller-rhel9:v3.6-ea.1
    # Auto-discovers config/overlays/odh/accelerators and its Kustomize overlay.

    # Optional per-template overrides for LLMInferenceServiceConfig inputs.
    # Paths are relative to the fetched source. Each override affects only the
    # version generated by this source; configure other controller releases separately.
    # templates:
    #   config/overlays/odh/accelerators/nvidia-cuda-config-llm-single-node-template.yaml:
    #     minimum_rhoai_version: "3.5" # Override the target tag's "3.6" default.
    #     name: kserve-config-llm-single-node-template-nvidia-cuda # Stable catalog identifier.
    #     version: 0.26.0+rhaiv.8 # Override the resolved runtime version.
    #     image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1 # Must occur in the rendered config.
    #     replacements: # Exact image-field substitutions, e.g. for raw configs.
    #       placeholder: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1

    parameters:
      kserve-llm-d-nvidia-cuda: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1
      kserve-llm-d-amd-rocm: registry.redhat.io/rhaii-fast/vllm-rocm-rhel9:3.6.0-fast.1
      kserve-llm-d-intel-gaudi: registry.redhat.io/rhaii-fast/vllm-gaudi-rhel9:3.6.0-fast.1
      kserve-llm-d-ibm-spyre: registry.redhat.io/rhaii-fast/vllm-spyre-rhel9:3.6.0-fast.1
      kserve-llm-d-cpu: registry.redhat.io/rhaii-fast/vllm-cpu-rhel9:3.6.0-fast.1

  - id: odh-model-controller-3-6-0-ea-1
    target_image: registry.redhat.io/rhoai/odh-model-controller-rhel9:v3.6-ea.1
    # Auto-discovers config/runtimes and config/base/params.env.

    # Optional per-template overrides. Paths are relative to the fetched source.
    # minimum_rhoai_version overrides the default only for this source's version;
    # configure other controller releases separately. Enable only the fields needed.
    # templates:
    #   config/runtimes/vllm/vllm-cuda-template.yaml:
    #     minimum_rhoai_version: "3.5" # Override the target tag's "3.6" default.
    #     name: vllm-cuda # Override the stable catalog identifier.
    #     version: 0.26.0+rhaiv.8 # Override the resolved runtime version.
    #     image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1 # Must occur in the rendered template.
    #     replacements: # Exact image-field substitutions, e.g. for raw templates.
    #       placeholder: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1

    parameters:
      ovms-image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9:v3.6-ea.1
      mlserver-image: registry.redhat.io/rhoai/odh-mlserver-rhel9:v3.6-ea.1
      mlserver-cuda-image: registry.redhat.io/rhoai/odh-mlserver-cuda-rhel9:v3.6-ea.1
      autogluon-image: registry.redhat.io/rhoai/odh-kserve-autogluon-server-rhel9:v3.6-ea.1
      vllm-cuda-image: registry.redhat.io/rhaii-fast/vllm-cuda-rhel9:3.6.0-fast.1
      vllm-rocm-image: registry.redhat.io/rhaii-fast/vllm-rocm-rhel9:3.6.0-fast.1
      vllm-gaudi-image: registry.redhat.io/rhaii-fast/vllm-gaudi-rhel9:3.6.0-fast.1
      vllm-spyre-image: registry.redhat.io/rhaii-fast/vllm-spyre-rhel9:3.6.0-fast.1
      # This older CPU runtime has no 3.6 EA alias; retain the bundle digest.
      vllm-cpu-image: registry.redhat.io/rhoai/odh-vllm-cpu-rhel9@sha256:d5a0acf592967aded878428f9c0c91e67a402a3a68c4baeb14b69305e4d7e71c
      vllm-cpu-x86-image: registry.redhat.io/rhaii-fast/vllm-cpu-rhel9:3.6.0-fast.1
      vllm-omni-cuda-image: registry.redhat.io/rhaii-fast/vllm-omni-cuda-rhel9:3.6.0-fast.1
      guardrails-detector-huggingface-runtime-image: registry.redhat.io/rhoai/odh-guardrails-detector-huggingface-runtime-rhel9:v3.6-ea.1

  - id: kserve-llmisvc-3-6
    target_image: registry.redhat.io/rhoai/odh-kserve-llmisvc-controller-rhel9:v3.6
    # Expected floating GA aliases, inferred from existing rhaii/...:3.5 tags.
    # Generation resolves published aliases to SHA digests and skips runtime
    # versions using unpublished images. Keep these aliases in the configuration.
    parameters:
      kserve-llm-d-nvidia-cuda: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.6
      kserve-llm-d-amd-rocm: registry.redhat.io/rhaii/vllm-rocm-rhel9:3.6
      kserve-llm-d-intel-gaudi: registry.redhat.io/rhaii/vllm-gaudi-rhel9:3.6
      kserve-llm-d-ibm-spyre: registry.redhat.io/rhaii/vllm-spyre-rhel9:3.6
      kserve-llm-d-cpu: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.6

  - id: odh-model-controller-3-6
    target_image: registry.redhat.io/rhoai/odh-model-controller-rhel9:v3.6
    # Expected floating GA aliases: rhoai/...:v3.6 follows existing v3.5 tags.
    # vLLM images use stable 3.6 tags. Stable Omni availability is unconfirmed;
    # registry absence permits skipping; denied access needs --skip-unavailable-images.
    parameters:
      ovms-image: registry.redhat.io/rhoai/odh-openvino-model-server-rhel9:v3.6
      mlserver-image: registry.redhat.io/rhoai/odh-mlserver-rhel9:v3.6
      mlserver-cuda-image: registry.redhat.io/rhoai/odh-mlserver-cuda-rhel9:v3.6
      autogluon-image: registry.redhat.io/rhoai/odh-kserve-autogluon-server-rhel9:v3.6
      vllm-cuda-image: registry.redhat.io/rhaii/vllm-cuda-rhel9:3.6
      vllm-rocm-image: registry.redhat.io/rhaii/vllm-rocm-rhel9:3.6
      vllm-gaudi-image: registry.redhat.io/rhaii/vllm-gaudi-rhel9:3.6
      vllm-spyre-image: registry.redhat.io/rhaii/vllm-spyre-rhel9:3.6
      # Newer controller sources renamed the ppc64le/s390x CPU parameter.
      vllm-cpu-pz-image: registry.redhat.io/rhoai/odh-vllm-cpu-rhel9:v3.6
      vllm-cpu-x86-image: registry.redhat.io/rhaii/vllm-cpu-rhel9:3.6
      vllm-omni-cuda-image: registry.redhat.io/rhaii/vllm-omni-cuda-rhel9:3.6
      guardrails-detector-huggingface-runtime-image: registry.redhat.io/rhoai/odh-guardrails-detector-huggingface-runtime-rhel9:v3.6
